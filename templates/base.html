<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThRead</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-success px-4">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="{% url 'books:index' %}">ThRead</a>
      <div class="d-flex align-items-center gap-3">
        <a class="nav-link text-white-50" href="{% url 'books:index' %}">INDEX</a>
        {% if request.user.is_authenticated %}
          <a class="nav-link text-white-50" href="{% url 'books:create' %}">CREATE</a>
          <a class="nav-link text-white-50" href="{% url 'accounts:profile' request.user.username %}">MY PROFILE</a>
          <form action="{% url 'accounts:logout' %}" method="POST" class="d-inline m-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-link nav-link text-white-50 p-0 text-decoration-none">LOGOUT</button>
          </form>
        {% else %}
          <a class="nav-link text-white-50" href="{% url 'accounts:login' %}">LOGIN</a>
          <a class="nav-link text-white-50" href="{% url 'accounts:signup' %}">SIGNUP</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <div class="container my-5">
    {% block content %}
    {% endblock content %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
